# Default: VPS flat directory (/opt/prisma) — pre-loaded image, no build.
#   docker load -i prism-server.tar
#   docker compose up -d
#
# Build from source (dev machine, inside repo): docker-compose.build.yml

services:
  prism-server:
    image: anarac/prism-server:test
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    env_file:
      - .env
    # Uncomment for max throughput (disables morph size-padding; reduces stealth):
    # environment:
    #   - PRISM_FAST=1
    volumes:
      - prism-data:/var/lib/prism
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sed -i 's/\r$$//' /entrypoint.sh; exec /bin/sh /entrypoint.sh

volumes:
  prism-data:
