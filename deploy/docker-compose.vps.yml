# VPS deploy from a flat directory (e.g. /opt/prisma) — NO build, uses a pre-loaded image.
#
# Copy to VPS: docker-compose.vps.yml, .env, prism-server.tar
#   docker load -i prism-server.tar
#   docker compose -f docker-compose.vps.yml up -d
#
# Do NOT run `docker compose up -d --build` here unless the full prism/ Rust tree
# is on the server (see docker-compose.build.yml).

services:
  prism-server:
    image: anarac/prism-server:test
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    env_file:
      - .env
    # Uncomment for max throughput on the server (all sessions):
    # environment:
    #   - PRISM_PERF=1
    # Weaker variant (padding off only, CC unchanged):
    # environment:
    #   - PRISM_FAST=1
    volumes:
      - prism-data:/var/lib/prism
    restart: unless-stopped
    # Hotfix CRLF entrypoint in images built on Windows
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sed -i 's/\r$$//' /entrypoint.sh; exec /bin/sh /entrypoint.sh

volumes:
  prism-data:
